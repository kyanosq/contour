name: contour
description: "Contour (量形) — AI tailor measurement in two photos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  provider: ^6.1.2
  go_router: ^16.2.4
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  camera: ^0.11.2
  sensors_plus: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  share_plus: ^11.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/samples/
